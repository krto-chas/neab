# NEAB Security Assessment - Input Configuration
# Denna fil kan fyllas i manuellt eller genereras från webformulär
# Version: 2.0
# Senast uppdaterad: 2024-12-02

# ============================================================================
# ORGANISATION
# ============================================================================
organisation:
  namn: "Nordlunda Energi AB"
  kort_namn: "NEAB"
  typ: "Regionalt energibolag (DSO + Fjärrvärme)"
  ägarstruktur: "Kommunalt ägt"

  kunder:
    elnat: 85000
    fjarrvärme: 12000

  personal:
    totalt: 450
    drift_beredskap: 60
    it_ot: 40
    kundservice: 30

  geografisk_rackvidd:
    - "Nordlunda kommun"
    - "Grannkommun (nord)"

# ============================================================================
# KRITISKA ANLÄGGNINGAR
# ============================================================================
kritiska_anlaggningar:
  - namn: "Driftcentral"
    antal: 1
    kritikalitet: "Mycket hög"

  - namn: "Datacenter (primärt)"
    antal: 1
    kritikalitet: "Mycket hög"

  - namn: "Datacenter (DR)"
    antal: 1
    kritikalitet: "Hög"

  - namn: "Regionnätsstationer"
    antal: 14
    kritikalitet: "Hög"

  - namn: "Nätstationer"
    antal: 260
    kritikalitet: "Medel"

  - namn: "Fjärrvärmeverk"
    antal: 1
    kritikalitet: "Mycket hög"

  - namn: "Värmecentraler"
    antal: 3
    kritikalitet: "Hög"

  - namn: "Publika laddstationer"
    antal: 25
    kritikalitet: "Låg"

  - namn: "Vindkraftverk"
    antal: 3
    kritikalitet: "Medel"

  - namn: "Solpark"
    antal: 1
    kritikalitet: "Låg"

# ============================================================================
# TJÄNSTER OCH PROCESSER
# ============================================================================
tjanster:
  - "Eldistribution (DSO)"
  - "Fjärrvärmeproduktion och distribution"
  - "Mätvärdeshantering (AMI)"
  - "Avbrottshantering (OMS)"
  - "Publika laddtjänster"
  - "Anslutning av mikroproduktion"

verksamhetsprocesser:
  - namn: "Planering och projektering"
    beskrivning: "Kapacitet, reinvesteringar, koncessionsfrågor"

  - namn: "Drift och underhåll"
    beskrivning: "24/7-bemanning, felavhjälpning, beredskap"

  - namn: "Mätvärdesinsamling och avräkning"
    beskrivning: "Daglig inläsning från smarta mätare, marknadskommunikation"

  - namn: "Kundprocesser"
    beskrivning: "Anslutning, flytt, fakturering, reklamation"

  - namn: "Säkerhet och beredskap"
    beskrivning: "Cyber, fysisk säkerhet, reservkraft, krisledning"

  - namn: "Leverantörsstyrning"
    beskrivning: "Entreprenörer, systemleverantörer, driftpartners"

# ============================================================================
# REGULATORISKA KRAV
# ============================================================================
regulatoriska_krav:
  nis2:
    tillamplig: true
    klassificering: "Väsentlig enhet"
    sektor: "Energi"
    artiklar_relevanta:
      - "21 (Riskhanteringsåtgärder)"
      - "23 (Incidenthantering)"
      - "24 (Anmälningsskyldighet)"
      - "20 (Styrelsens ansvar)"

  gdpr:
    tillamplig: true
    personuppgifter_typer:
      - "Kundregister"
      - "Mätvärden (energiförbrukning)"
      - "Inspelad kundkommunikation"
      - "Personaldata"
    artiklar_relevanta:
      - "32 (Säkerhet)"
      - "35 (DPIA)"
      - "33 (Personuppgiftsincidenter)"

  dora:
    tillamplig: false
    anledning: "Inte finansiell enhet"

  cer:
    tillamplig: true
    beskrivning: "Fysisk resiliens för kritiska entiteter"

  nationell_energireglering:
    tillamplig: true
    krav:
      - "Leveranssäkerhet (SAIDI/SAIFI)"
      - "Avbrottsstatistik och rapportering"
      - "Koncessionskrav"

# ============================================================================
# KRONJUVELER (Crown Jewels) - Kritiska system
# ============================================================================
kronjuveler:
  - system: "SCADA/DCS"
    beskrivning: "Primär styrning och övervakning av elnät och fjärrvärme"
    rto_minuter: 30
    rpo_minuter: 5
    kritikalitet: "Mycket hög"

  - system: "Nätstations-RTU:er och PLC:er"
    beskrivning: "Fältutrustning för styrning och skydd"
    rto_minuter: 120
    rpo_minuter: 10
    kritikalitet: "Hög"

  - system: "AMI/MDM"
    beskrivning: "Smarta mätare - insamling, konfiguration, fjärrbryt"
    rto_minuter: 240
    rpo_minuter: 15
    kritikalitet: "Hög"

  - system: "OMS"
    beskrivning: "Avbrottshantering och callcenterkoppling"
    rto_minuter: 240
    rpo_minuter: 15
    kritikalitet: "Hög"

  - system: "GIS/NIS"
    beskrivning: "Nätkarta och tillgångsregister"
    rto_minuter: 480
    rpo_minuter: 60
    kritikalitet: "Medel"

  - system: "Kund- och faktureringssystem"
    beskrivning: "PII, betalflöden"
    rto_minuter: 1440
    rpo_minuter: 240
    kritikalitet: "Hög"

  - system: "Identitets- och behörighetsplattform"
    beskrivning: "AD/AAD, PKI, MFA"
    rto_minuter: 60
    rpo_minuter: 15
    kritikalitet: "Mycket hög"

  - system: "SIEM och OT-monitorering"
    beskrivning: "Logg- och övervakningsplattform"
    rto_minuter: 120
    rpo_minuter: 5
    kritikalitet: "Hög"

  - system: "Backup-system"
    beskrivning: "Inkl. immutabel backup"
    rto_minuter: 240
    rpo_minuter: 60
    kritikalitet: "Mycket hög"

# ============================================================================
# IT/OT ARKITEKTUR
# ============================================================================
it_ot_arkitektur:
  zoner:
    - namn: "IT-zon"
      beskrivning: "Kontors-IT, affärssystem, M365, ekonomisystem"
      segmentering: "VLAN-baserad"

    - namn: "DMZ"
      beskrivning: "Datautbyte IT/OT, API-gateways, jump servers"
      segmentering: "Brandvägg, PAM"

    - namn: "OT-zon"
      beskrivning: "SCADA, HMI, historik, ingenjörsarbetsplatser"
      segmentering: "Fysiskt separerad + VLAN"

    - namn: "Fältnät"
      beskrivning: "Stationer, IEC 60870-5-104/IEC 61850"
      segmentering: "Dedikerade VLAN, begränsad routing"

  fjarratkomst:
    metod: "Bastionvärdar med MFA"
    loggning: "Inspelad session"
    tidsbegransning: true
    leverantorsaccess: "Särskild gateway, tidsstyrd"

  kommunikationsbarare:
    primar: "MPLS/IP mellan anläggningar"
    redundans: "Redundanta vägar till driftcentral"
    fallback: "4G/5G på utvalda stationer"
    out_of_band: "Separat bärare för kritiska stationer"

# ============================================================================
# MOLN OCH SAAS
# ============================================================================
moln:
  m365:
    anvandning: "Samarbete och e-post"
    sakerhet: "MFA, Conditional Access"

  iaas_paas:
    anvandning: "Dataanalys och kundnära applikationer"
    leverantor: "Azure"
    region: "West Europe"

  oms_mdm:
    leverantorshostade: true
    uppkoppling: "VPN eller privat peering"

  siem:
    moln: true
    region: "EU"
    datalagring: "Enligt GDPR"

# ============================================================================
# API-ANVÄNDNING
# ============================================================================
api_scenarios:
  b2b:
    - namn: "Mätdata till faktureringspartner"
      partner: "PayGrid"
      frekvens: "Dagligen"
      protokoll: "REST API"
      autentisering: "OAuth 2.0"
      kryptering: "TLS 1.3"
      kritikalitet: "Hög"

    - namn: "Reservdelstillgång från leverantör"
      partner: "TechSupply AB"
      frekvens: "Realtid"
      protokoll: "REST API"
      autentisering: "API key"
      kryptering: "TLS 1.2"
      kritikalitet: "Medel"

    - namn: "SCADA fjärrsupport"
      partner: "SCADA-leverantör"
      frekvens: "On-demand"
      protokoll: "Särskild gateway"
      autentisering: "MFA + tidsbegränsad"
      kryptering: "VPN"
      kritikalitet: "Mycket hög"

  b2c:
    - namn: "Kundportal (mobilapp)"
      tjanst: "Elförbrukning, fakturor, laddstatistik"
      autentisering: "BankID"
      kryptering: "TLS 1.3"
      personuppgifter: true
      kritikalitet: "Hög"

    - namn: "Webbportal felavbrott"
      tjanst: "Aktuella avbrott, planerade arbeten"
      autentisering: "Ingen (publik info)"
      kryptering: "TLS 1.3"
      personuppgifter: false
      kritikalitet: "Medel"

# ============================================================================
# HOTBILD
# ============================================================================
hotbild:
  - hot: "Ransomware via kontors-IT"
    sannolikhet: "Hög"
    konsekvens: "Mycket hög"
    beskrivning: "Risk för sidoförflyttning mot OT vid bristande zonindelning"

  - hot: "Leverantörskedjeangrepp"
    sannolikhet: "Medel"
    konsekvens: "Mycket hög"
    beskrivning: "Komprometterat uppdateringsflöde eller fjärrsupportkonto"

  - hot: "Phishing / MFA-trötthet"
    sannolikhet: "Hög"
    konsekvens: "Hög"
    beskrivning: "Stulna autentiseringstokens"

  - hot: "Felkonfiguration i moln"
    sannolikhet: "Medel"
    konsekvens: "Hög"
    beskrivning: "Exponerad data eller loggflöden"

  - hot: "API-säkerhetsbrister"
    sannolikhet: "Medel"
    konsekvens: "Hög"
    beskrivning: "Felkonfigurerad gateway, otillräcklig segmentering"

  - hot: "DDoS mot kundportaler"
    sannolikhet: "Medel"
    konsekvens: "Medel"
    beskrivning: "Påverkar kundnära tjänster och laddstationer"

  - hot: "OT-specifika hot"
    sannolikhet: "Låg"
    konsekvens: "Mycket hög"
    beskrivning: "Manipulering av setpoints, replay-attacker, missbruk av fjärrbryt"

  - hot: "Insiderhot"
    sannolikhet: "Låg"
    konsekvens: "Hög"
    beskrivning: "Obehörig åtkomst eller avvikelse från rutiner"

# ============================================================================
# KÄNDA BRISTER
# ============================================================================
kanda_brister:
  - brist: "Ojämnt införande av MFA"
    omrade: "Åtkomststyrning"
    allvarlighet: "Hög"

  - brist: "Otydlig behörighetsstyrning i äldre OT-system"
    omrade: "OT-säkerhet"
    allvarlighet: "Hög"
    detalj: "Delade konton förekommer"

  - brist: "Riskregister ej kopplat till mätetal"
    omrade: "GRC"
    allvarlighet: "Medel"

  - brist: "Ojämn leverantörsuppföljning"
    omrade: "Tredjepartsstyrning"
    allvarlighet: "Medel"

  - brist: "Nätsegmentering behöver uppdateras"
    omrade: "Nätverkssäkerhet"
    allvarlighet: "Hög"
    detalj: "Dokumentation efter ad hoc-förändringar"

  - brist: "Manuell backup av vissa OT-konfigurationer"
    omrade: "Backup"
    allvarlighet: "Medel"

# ============================================================================
# SÄKERHETSSTYRNING
# ============================================================================
sakerhetsstyrning:
  roller:
    - roll: "Styrelse och VD"
      ansvar: "Formellt ansvar enligt NIS2"

    - roll: "CISO"
      ansvar: "Övergripande säkerhetsstrategi, GRC, riskhantering"
      stab: "GRC-specialist, säkerhetsarkitekt, riskanalytiker"

    - roll: "OT-säkerhetsansvarig"
      ansvar: "OT-specifik säkerhet, samordning med driftchef"

    - roll: "SOC (via MSSP)"
      ansvar: "24/7-övervakning, definierade playbooks"

    - roll: "Incidentledare"
      ansvar: "Koordinering vid större incidenter"

    - roll: "Kriskommunikatör"
      ansvar: "Extern kommunikation"

  ovningar:
    bordsspel: "Kvartalsvis"
    tekniska_aterlasningar: "Halvårsvis"
    ot_aterstallning: "Årligen"

# ============================================================================
# MÅLSÄTTNINGAR
# ============================================================================
affars_och_verksamhetsmal:
  - "Elsäkerhet och leveranssäkerhet med låga SAIDI/SAIFI-värden"
  - "Trygg värmeförsörjning vintertid"
  - "Snabb incidentrespons och transparent kundkommunikation"
  - "Efterlevnad av lagar och föreskrifter utan onödiga driftstörningar"
  - "Kostnadseffektiv drift med dokumenterad riskkontroll"

# ============================================================================
# METADATA
# ============================================================================
metadata:
  version: "2.0"
  created: "2024-12-02"
  last_modified: "2024-12-02"
